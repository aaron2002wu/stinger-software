[stack]
name = "stinger-software"
version = "26.08.1"

[container]
base = "ros:jazzy"
package-manager = "apt"
pre-setup = [
    "touch /var/mail/ubuntu && chown ubuntu /var/mail/ubuntu && userdel -r ubuntu"
]

mounts = [
    { source="/dev", target="/dev" },
    { source="/run/udev", target="/run/udev:ro" }
]

[system.apt]
dependencies = [
    # Core ROS 2 & Simulation
    "ros-jazzy-robot-localization",
    "ros-jazzy-tf-transformations",
    "ros-jazzy-urdfdom-py",
    "ros-jazzy-xacro",
    "ros-jazzy-cv-bridge",
    "ros-jazzy-sensor-msgs-py",
    "ros-jazzy-ros-gz-sim",
    "ros-jazzy-ros-gz-bridge",
    "ros-jazzy-rosbridge-suite",
    "ros-jazzy-foxglove-bridge",
    
    # GUI & Tutorial Analysis Tools
    "ros-jazzy-rviz2",
    "ros-jazzy-rqt",
    "ros-jazzy-rqt-image-view",
    "ros-jazzy-plotjuggler-ros",

    # Utilities, Vision & Build Tools
    "python3-pip",
    "python3-colcon-common-extensions",
    "python3-pytest",
    "python3-opencv",
    "libgoogle-glog-dev",
    "v4l-utils",
    "i2c-tools",
    "iputils-ping",
    "tmux",
    "tmuxp",
    "nano",
    "git"
]

[system.pip]
break-system-packages = true
dependencies = [
    "pyserial",
    "numpy<2",
    "transforms3d",
]

[tool.colcon.dependencies]
sllidar_ros2 = { server = "github.com", namespace = "Slamtec", name = "sllidar_ros2", version = "main" }
